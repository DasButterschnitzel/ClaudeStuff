<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Pop-up³ Ausstellungsplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D-Bühne links (Grundriss + Themeninseln) · Planungsakte rechts mit Reitern · mobil: Bühne oben, Akte darunter */
:root {
  --bg: #efedf3; --stage-a: #f7f6fa; --stage-b: #dcd8e4;
  --panel: #fbfafc; --card: #ffffff; --ink: #1d1626; --ink-2: #5a5266; --ink-3: #8a8296;
  --line: rgba(29, 22, 38, 0.12); --chip: rgba(29, 22, 38, 0.06);
  --orange: #d9540a; --orange-bg: #fde6d6; --lila: #74399a; --lila-bg: #eee1f6;
  --ok: #2a7d4f; --warn: #a15c00; --warn-bg: #fdefd2; --open: #b3261e; --open-bg: #fbe3e0;
  --shadow: 0 10px 28px -14px rgba(29, 22, 38, 0.4), 0 2px 6px -2px rgba(29, 22, 38, 0.14);
  --font-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111b; --stage-a: #2a2433; --stage-b: #17131d;
    --panel: #1c1724; --card: #241e2e; --ink: #f0ebf6; --ink-2: #b5acc2; --ink-3: #8d849b;
    --line: rgba(240, 235, 246, 0.13); --chip: rgba(240, 235, 246, 0.08);
    --orange: #ff8b45; --orange-bg: #47250f; --lila: #c79be6; --lila-bg: #37234a;
    --ok: #74c798; --warn: #eab054; --warn-bg: #43310f; --open: #f59088; --open-bg: #4a1f1c;
    --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.75), 0 2px 6px -2px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111b; --stage-a: #2a2433; --stage-b: #17131d;
  --panel: #1c1724; --card: #241e2e; --ink: #f0ebf6; --ink-2: #b5acc2; --ink-3: #8d849b;
  --line: rgba(240, 235, 246, 0.13); --chip: rgba(240, 235, 246, 0.08);
  --orange: #ff8b45; --orange-bg: #47250f; --lila: #c79be6; --lila-bg: #37234a;
  --ok: #74c798; --warn: #eab054; --warn-bg: #43310f; --open: #f59088; --open-bg: #4a1f1c;
  --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.75), 0 2px 6px -2px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
a { color: var(--lila); }
h1, h2, h3, p { margin: 0; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 9px; padding-left: var(--gl); padding-right: var(--gr); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1 1 260px; }
.logo { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 14px; box-shadow: inset 0 0 0 4px rgba(255,255,255,.28); }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { color: var(--ink-2); font-size: 12.5px; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); padding: 5px 10px; border-radius: 99px; background: var(--chip); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.sync[data-s="shared"] i { background: var(--ok); }
.sync[data-s="local"] i, .sync[data-s="readonly"] i { background: var(--warn); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 20%, var(--stage-a), var(--stage-b)); touch-action: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.chip3d { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 99px; border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: auto; cursor: pointer; margin: -14px 0 0 -14px; }
.chip3d b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.chip3d.sel { outline: 2px solid var(--ink); }
.tag3d { position: absolute; left: 0; top: 0; transform-origin: 0 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .02em; color: var(--ink-2); background: color-mix(in srgb, var(--card) 82%, transparent); padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin: -9px 0 0 0; translate: -50% 0; }
.stage.compact .chip3d span { display: none; }
.stage.compact .chip3d { padding-right: 3px; }
.stage.compact .tag3d { display: none; }

.bar { position: absolute; display: flex; flex-wrap: wrap; gap: 6px; z-index: 5; }
.bar.tl { top: 10px; left: var(--gl); right: var(--gr); }
.bar.bl { bottom: 10px; left: var(--gl); right: var(--gr); align-items: flex-end; }
.seg { display: inline-flex; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 3px; gap: 2px; }
.seg button, .tool { border: 0; background: transparent; border-radius: 7px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button:hover, .tool:hover { color: var(--ink); background: var(--chip); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tool { background: var(--card); box-shadow: var(--shadow); border-radius: 10px; padding: 9px 12px; }
.tool[aria-pressed="true"] { background: var(--orange); color: #fff; }
.spacer { flex: 1 1 auto; }
.float { position: absolute; z-index: 6; background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; }
#inspect { top: 56px; right: var(--gr); width: min(250px, calc(100% - 32px)); }
#inspect h3 { font-size: 13px; margin-bottom: 2px; }
#inspect .mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); }
#inspect .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 9px; font-size: 12px; font-weight: 600; cursor: pointer; }
.mini:hover { background: var(--chip); }
#tourbar { bottom: 62px; left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; max-width: calc(100% - 32px); }
#tourbar b { font-family: var(--font-mono); font-weight: 500; }
#hint { bottom: 62px; left: var(--gl); max-width: min(360px, calc(100% - 32px)); color: var(--ink-2); }
#nogl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; z-index: 50; background: var(--stage-b); }

.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 10px 10px; font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
.tabs .cnt { font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--open-bg); color: var(--open); padding: 1px 6px; border-radius: 99px; margin-left: 4px; }
.tabbody { overflow: auto; padding: 16px 16px 32px; min-width: 0; }
.tabbody > section { display: flex; flex-direction: column; gap: 18px; }
.tabbody h2 { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .01em; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lead { font-size: 15px; line-height: 1.5; max-width: 62ch; }
.blk { display: flex; flex-direction: column; gap: 8px; }
.blk p, .blk li { max-width: 64ch; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.tile b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11.5px; color: var(--ink-2); line-height: 1.25; display: block; }
.tile.o b { color: var(--open); } .tile.w b { color: var(--warn); }
table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv td:last-child { text-align: right; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--chip); border-radius: 8px; padding: 8px 10px; max-width: 64ch; }
.dates { display: flex; flex-direction: column; gap: 6px; }
.dates div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.dates time, .dates .when { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }

.st { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.st.sel { border-color: var(--ink); }
.st summary { list-style: none; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
.st summary::-webkit-details-marker { display: none; }
.st .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 13px; }
.st .nm { font-weight: 700; font-size: 14px; }
.st .sub { font-size: 12px; color: var(--ink-2); }
.st .body { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.st .body p { max-width: 62ch; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--chip); color: var(--ink-2); }
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.btn { align-self: flex-start; border: 0; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp > h3 { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.grp > h3 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.todo { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 9px; align-items: start; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.todo input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--orange); }
.todo label { cursor: pointer; }
.todo .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.todo.done label { text-decoration: line-through; color: var(--ink-3); }
.empty { color: var(--ink-2); padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

.calc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.calc .ctl { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 4px 10px; align-items: center; }
.calc .ctl label { font-size: 12.5px; color: var(--ink-2); grid-column: 1 / -1; }
.calc input[type=range] { width: 100%; accent-color: var(--orange); }
.calc output { font-family: var(--font-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.result { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.result div { background: var(--orange-bg); border-radius: 9px; padding: 8px 9px; }
.result b { display: block; font-family: var(--font-display); font-size: 18px; color: var(--orange); font-variant-numeric: tabular-nums; }
.result span { font-size: 11.5px; color: var(--ink-2); display: block; line-height: 1.25; }
.tw { overflow-x: auto; }
table.mat { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
table.mat th:nth-child(1) { width: 31%; } table.mat th:nth-child(2) { width: 27%; }
table.mat td { overflow-wrap: anywhere; }
table.mat th { text-align: left; font-size: 11px; color: var(--ink-3); font-weight: 600; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
table.mat td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mat td:nth-child(2) { font-family: var(--font-mono); font-size: 11.5px; }

@media (max-width: 900px) {
  html, body { height: auto; }
  #app { height: auto; display: block; }
  .work { display: block; }
  .stage { height: 60svh; min-height: 330px; }
  .panel { display: block; border-left: 0; border-top: 1px solid var(--line); }
  .tabs { padding-left: calc(var(--gl) - 6px); padding-right: var(--gr); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--panel); z-index: 8; }
  .tabbody { overflow: visible; padding-left: var(--gl); padding-right: var(--gr); }
  .tool { padding: 8px 10px; }
  #inspect { top: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">50</div>
      <div>
        <h1>Pop-up³ Ausstellungsplaner</h1>
        <p>50 Jahre Dreieich · Offenbacher Straße 1 · Stand Protokoll 2 vom 17.11.2026</p>
      </div>
    </div>
    <div class="sync" id="sync" data-s="wait" title="Wo abgehakte To-dos und verschobene Inseln gespeichert werden"><i></i><span>Verbinde …</span></div>
  </header>

  <main class="work">
    <section class="stage" id="stage" aria-label="3D-Modell des Pop-up-Stores">
      <canvas id="gl" tabindex="0" aria-label="3D-Ansicht: ziehen zum Drehen, scrollen zum Zoomen"></canvas>
      <div id="labels"></div>

      <div class="bar tl">
        <div class="seg" role="group" aria-label="Ansicht" id="views">
          <button type="button" data-view="iso" aria-pressed="true">3D</button>
          <button type="button" data-view="plan" aria-pressed="false">Grundriss</button>
          <button type="button" data-view="eingang" aria-pressed="false">Eingang</button>
          <button type="button" data-view="fenster" aria-pressed="false">Schaufenster</button>
        </div>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Einblenden">
          <button type="button" id="t-expo" aria-pressed="true" title="Themeninseln ein- oder ausblenden">Inseln</button>
          <button type="button" id="t-dims" aria-pressed="false" title="Maße aus dem Bestandsplan">Maße</button>
          <button type="button" id="t-people" aria-pressed="true" title="Figuren als Größenvergleich">Figuren</button>
        </div>
      </div>

      <div class="float" id="inspect" hidden></div>
      <div class="float" id="hint" hidden></div>
      <div class="float" id="tourbar" hidden>
        <button type="button" class="mini" id="tour-prev" aria-label="Vorherige Insel">←</button>
        <span><b id="tour-n">1/8</b> <span id="tour-name"></span></span>
        <button type="button" class="mini" id="tour-next" aria-label="Nächste Insel">→</button>
        <button type="button" class="mini" id="tour-stop">Beenden</button>
      </div>

      <div class="bar bl">
        <button type="button" class="tool" id="b-tour" aria-pressed="false">Rundgang</button>
        <button type="button" class="tool" id="b-walk" aria-pressed="false">Begehen</button>
        <button type="button" class="tool" id="b-move" aria-pressed="false">Inseln verschieben</button>
      </div>
      <div id="nogl" hidden><div><h2>3D nicht verfügbar</h2><p>Dieser Browser stellt kein WebGL bereit. Die Planungsakte rechts funktioniert trotzdem.</p></div></div>
    </section>

    <aside class="panel" aria-label="Planungsakte">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="ueber" aria-selected="true">Überblick</button>
        <button type="button" role="tab" data-tab="inseln" aria-selected="false">Themeninseln</button>
        <button type="button" role="tab" data-tab="todos" aria-selected="false">To-dos<span class="cnt" id="cnt-open"></span></button>
        <button type="button" role="tab" data-tab="rechner" aria-selected="false">Rechner</button>
      </div>
      <div class="tabbody" id="tabbody">
        <section id="tab-ueber"></section>
        <section id="tab-inseln" hidden></section>
        <section id="tab-todos" hidden></section>
        <section id="tab-rechner" hidden></section>
      </div>
    </aside>
  </main>
</div>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
// ---- 01-core.js ----
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   CORE: Hilfen, Renderer, Texturen, Geometrie-Bausteine
   Koordinaten (Meter): x = Breite, 0 = linke Außenwand (Naturstein), W = Brandmauer rechts
                        z = Tiefe,  0 = Rückwand, zG = Glas der langen Fensterfront
                        y = Höhe
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const V3 = THREE.Vector3, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const de = (n, d = 2) => Number(n).toFixed(d).replace('.', ',');
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- Renderer ---------- */
const stageEl = $('#stage'), canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#nogl').hidden = false;
  window.__noGL = true;
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
let controls = null;
let dirty = 3;
const invalidate = (n = 2) => { dirty = Math.max(dirty, n); };
if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.09;

/* Text mit Umbruch, vertikal um cy zentriert; gibt die Blockhöhe zurück */
function wrapText(g, text, cx, cy, maxW, size, font, weight = 700, lh = 1.15) {
  g.font = `${weight} ${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const lines = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    lines.push(line);
  }
  const H = lines.length * size * lh;
  lines.forEach((l, i) => g.fillText(l, cx, cy - H / 2 + (i + 0.5) * size * lh));
  return H;
}

/* ---------- Geometrie-Bausteine (y = Unterkante) ---------- */
function shade(o, cast = true) { o.castShadow = cast; o.receiveShadow = true; return o; }
function box(w, h, d, m, x = 0, y = 0, z = 0, cast = true) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); return shade(o, cast); }
function cyl(r, h, m, x = 0, y = 0, z = 0, seg = 28, rTop = r) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, seg), m); o.position.set(x, y + h / 2, z); return shade(o); }
function ball(r, m, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m); o.position.set(x, y, z); return shade(o); }
/* Fläche von (x0,z0) nach (x1,z1); sichtbare Seite liegt in Laufrichtung links */
function wall(x0, z0, x1, z1, m, { h = 2.5, y0 = 0, rep = null } = {}) {
  const L = Math.hypot(x1 - x0, z1 - z0);
  const o = new THREE.Mesh(new THREE.PlaneGeometry(L, h), m);
  o.position.set((x0 + x1) / 2, y0 + h / 2, (z0 + z1) / 2);
  o.rotation.y = -Math.atan2(z1 - z0, x1 - x0);
  o.receiveShadow = true;
  return o;
}
/* Flaches Schild mit Text, liegt auf dem Boden (für Maße und Raumnamen) */
function flatText(text, { size = 0.34, color = '#3a3145', weight = 600, font = FB } = {}) {
  const px = 64; const c = document.createElement('canvas'); let g = c.getContext('2d');
  g.font = `${weight} ${px}px ${font}`; const tw = Math.ceil(g.measureText(text).width) + 24;
  c.width = tw; c.height = px + 24; g = c.getContext('2d');
  g.font = `${weight} ${px}px ${font}`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, 12, c.height / 2 + 3);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const geo = new THREE.PlaneGeometry(size * c.width / c.height, size); geo.rotateX(-PI / 2);
  const o = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  o.renderOrder = 3;
  return o;
}
/* Beschriftete Tafel: Canvas-Textur auf einer Fläche */
function sign(w, h, draw, { res = 256, emissive = false } = {}) {
  const t = ctex(Math.round(w * res), Math.round(h * res), draw);
  const m = emissive ? new THREE.MeshBasicMaterial({ map: t }) : new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 });
  const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); o.receiveShadow = !emissive;
  return o;
}

/* ---- 2 · Mero-System (3 × 2 m, 2 m hoch) ---- */

  for (let i = 0; i <= nx; i++) for (let j = 0; j < 3; j++) for (let k = 0; k <= nz; k++) {
    nodes.push(P(i, j, k));
    if (i < nx) struts.push([P(i, j, k), P(i + 1, j, k)]);
    if (k < nz) struts.push([P(i, j, k), P(i, j, k + 1)]);
    if (j < 2) struts.push([P(i, j, k), P(i, j + 1, k)]);
  }
  const d = new THREE.Object3D(), up = new V3(0, 1, 0);

  const txt = (head, bg = '#f6f3ee', fg = '#2b2533') => new THREE.MeshStandardMaterial({ map: ctex(256, 256, textPanel(bg, fg, head)), roughness: 0.8 });
  const panelZ = (i, j, k, mat) => g.add(box(0.93, 0.9, 0.02, mat, ox + i * m + 0.5, ys[j] + 0.035, oz + k * m));
  const panelX = (i, j, k, mat) => g.add(box(0.02, 0.9, 0.93, mat, ox + i * m, ys[j] + 0.035, oz + k * m + 0.5));
  panelZ(0, 0, 0, M(C.orange)); panelZ(1, 0, 0, txt('Exponate')); panelZ(2, 0, 0, M(C.lila));
  panelZ(0, 1, 0, txt('Dreieich um 1977')); panelZ(1, 1, 0, M(C.gelb)); panelZ(2, 1, 0, txt('Stadt im Wandel'));

/* ---- 5 · Litfaßsäule: Größe kommt aus dem Rechner ---- */
function buildLitfass({ d, h, n, rows, gap }) {
  const g = new THREE.Group(), r = d / 2, U = PI * d, rr = rng(9);
  const pal = [C.orange, C.lila, C.gelb, C.pink, C.tuerkis, C.oliv, '#f3ead7', '#d22a2a'];
  const tex = ctex(2048, 1024, (c, w, hh) => {
    c.fillStyle = '#b9b2a4'; c.fillRect(0, 0, w, hh);
    const pw = 0.42 / U * w, ph = 0.594 / h * hh, cw = w / Math.max(n, 1), top = (hh - rows * (ph + gap / h * hh)) / 2;
    for (let i = 0; i < n; i++) for (let j = 0; j < rows; j++) {
      const x = i * cw + (cw - pw) / 2, y = top + j * (ph + gap / h * hh) + gap / h * hh / 2, bg = pal[Math.floor(rr() * pal.length)], fg = pal[Math.floor(rr() * pal.length)];
      c.fillStyle = bg; c.fillRect(x, y, pw, ph);
      c.fillStyle = fg === bg ? '#2b2533' : fg; c.beginPath(); c.arc(x + pw / 2, y + ph * 0.38, pw * 0.28, 0, 7); c.fill();
      c.fillStyle = bg === '#f3ead7' || bg === C.gelb ? '#2b2533' : '#fff';
      c.fillRect(x + pw * 0.12, y + ph * 0.68, pw * 0.76, ph * 0.06); c.fillRect(x + pw * 0.12, y + ph * 0.79, pw * 0.5, ph * 0.035); c.fillRect(x + pw * 0.12, y + ph * 0.86, pw * 0.62, ph * 0.035);
    }
  });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 56), [new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }), mDark, mDark]);
  body.position.y = 0.22 + h / 2; shade(body); g.add(body);
  g.add(cyl(r + 0.035, 0.22, mDark, 0, 0, 0, 48), cyl(r + 0.06, 0.07, mDark, 0, 0.22 + h, 0, 48), cyl(r + 0.03, 0.13, M('#3d6b4f', { roughness: 0.5 }), 0, 0.29 + h, 0, 48, 0.06), ball(0.05, mDark, 0, 0.45 + h, 0));
  return g;
}

const KREIS_TITEL = ['Gebietsreform', '1. Januar 1977', 'Sprendlingen', 'Dreieichenhain', 'Götzenhain', 'Offenthal', 'Buchschlag', 'Der Name Dreieich', 'Vorher', 'Nachher', 'Stimmen'];
function kreisLayout(n) {
  const r = rng(11), out = [];
  for (let i = 0; i < n; i++) {
    const rad = i % 3 === 0 ? 0.3 : 0.25;
    for (let t = 0; t < 600; t++) {
      const z = 0.55 + r() * 7.55, y = 0.72 + r() * 1.38;
      if (out.every(o => Math.hypot(o.z - z, o.y - y) > o.rad + rad + 0.1)) { out.push({ z, y, rad }); break; }
    }
  }
  return out;
}
function buildGebietsreform(n) {
  const g = new THREE.Group(), x = R.W - 0.012;
  g.add(wall(x, 0.02, x, R.door.z - 0.02, M('#f2690d', { roughness: 0.95 })));
  const styles = [['#ffffff', '#3b1d57'], ['#f5b70a', '#3b1d57'], ['#5f2b84', '#ffffff'], ['#f3ead7', '#b8430a']];
  kreisLayout(n).forEach((k, i) => {
    const [bg, fg] = styles[i % styles.length], title = KREIS_TITEL[i] || `Text ${i + 1}`;
    const t = ctex(256, 256, (c, w) => {

      c.globalAlpha = 0.4; for (let j = 0; j < 4; j++) c.fillRect(w * 0.26, w * (0.56 + j * 0.065), w * (j === 3 ? 0.3 : 0.48), w * 0.022);
    });
    const m = new THREE.Mesh(new THREE.CylinderGeometry(k.rad, k.rad, 0.012, 48), [M(bg), new THREE.MeshStandardMaterial({ map: t, roughness: 0.75 }), M(bg)]);
    m.rotation.z = PI / 2; m.position.set(R.W - 0.03, k.y, k.z); g.add(m);   // Deckfläche zeigt in den Raum
  });
  return g;
}

function buildTheke(orange) {
  const g = new THREE.Group(), front = M(orange ? C.orange : '#2f3b4f', { roughness: 0.45 }), top = M('#f4f2ee', { roughness: 0.35 });
  g.add(box(3.2, 0.86, 0.65, front, 0, 0, 0), box(3.28, 0.04, 0.73, top, 0, 0.86, 0));
  g.add(box(0.65, 0.86, 1.9, front, -1.275, 0, -1.275), box(0.73, 0.04, 1.94, top, -1.275, 0.86, -1.255));
  if (orange) { const s = sign(1.7, 0.36, (c, w, h) => { c.fillStyle = '#fff'; wrapText(c, '50 Jahre Dreieich', w / 2, h / 2, w, h * 0.42, FD, 700); c.globalCompositeOperation = 'destination-over'; c.fillStyle = C.orange; c.fillRect(0, 0, w, h); }); s.position.set(0.3, 0.46, 0.327); g.add(s); }
  return g;
}
function buildFahne() {
  const g = new THREE.Group();
  const t = ctex(480, 760, (c, w, h) => {
    c.fillStyle = C.orange; c.fillRect(0, 0, w, h); c.fillStyle = '#5f2b84'; c.beginPath(); c.arc(w / 2, h * 0.5, w * 0.36, 0, 7); c.fill();
    c.fillStyle = '#fff'; wrapText(c, 'Willkommen', w / 2, h * 0.14, w * 0.94, w * 0.105, FD, 700);
    c.fillStyle = C.gelb; wrapText(c, '50', w / 2, h * 0.5, w, w * 0.34, FD, 800);
    c.fillStyle = '#fff'; wrapText(c, 'Jahre Dreieich', w / 2, h * 0.86, w * 0.9, w * 0.095, FB, 700);
  });
  const fm = new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 });
  const f = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.9), fm), f2 = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.9), fm);
  f.position.set(0, 1.4, 0.004); f2.position.set(0, 1.4, -0.004); f2.rotation.y = PI; f.castShadow = true; g.add(f, f2);
  g.add(box(1.26, 0.025, 0.025, mDark, 0, 2.35, 0, false), box(0.005, 0.13, 0.005, mDark, -0.55, 2.37, 0, false), box(0.005, 0.13, 0.005, mDark, 0.55, 2.37, 0, false));
  return g;
}
function buildKissen() {
  const g = new THREE.Group(), mo = M(C.orange, { roughness: 1 }), ml = M(C.lila, { roughness: 1 }), r = rng(2); let n = 0;
  const put = (x, z, ry) => { const k = box(0.48, 0.09, 0.34, n % 2 ? ml : mo, x, R.SILL, z); k.rotation.y = ry + (r() - 0.5) * 0.2; g.add(k); n++; };
  for (let x = 0.75; x < R.xRet - 0.4; x += 1.2) if ([R.colX, ...R.frontX].every(c => Math.abs(c - x) > 0.42)) put(x, R.zG - 0.2, 0);
  for (let z = R.zWW + 0.6; z < R.zG - 0.8; z += 1.2) if (R.westZ.every(c => Math.abs(c - z) > 0.42)) put(R.xG + 0.2, z, PI / 2);
  g.userData.count = n;
  return g;
}
function buildFigur(col = '#8f879c', h = 1.72) {
  const g = new THREE.Group(), m = M(col, { roughness: 0.9 });

}

  const { d, h, gap } = state.calc.litfass, U = PI * d;

function mount(def) {
  const group = new THREE.Group(); let inner = def.make(); group.add(inner);
  const [sx, sz, sy] = def.size, off = def.off || [0, 0];
  const proxy = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz)); proxy.visible = false; proxy.userData.id = def.id;
  const rect = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new V3(a * (sx / 2 + 0.08) + off[0], 0.025, b * (sz / 2 + 0.08) + off[1]));
  const outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(rect), new THREE.LineBasicMaterial({ color: def.color })); outline.visible = false;
  if (def.fixed) { proxy.position.set(def.pos[0] - sx / 2, sy / 2, def.pos[1]); outline.position.set(def.pos[0] - sx / 2, 0, def.pos[1]); }
  else proxy.position.set(off[0], sy / 2, off[1]);
  group.add(proxy, outline); proxies.push(proxy);
  (def.bestand ? scene : expo).add(group);
  items[def.id] = { def, group, proxy, outline, remake() { group.remove(inner); inner = def.make(); group.add(inner); invalidate(); } };
  place(def.id);
}
function place(id) {
  const { def, group } = items[id]; if (def.fixed) return;

      <summary><span class="num" style="background:${d.color}">${d.n}</span><span><span class="nm">${esc(d.name)}</span><br><span class="sub">${open.length ? `${open.length} von ${mine.length} offen` : 'alles erledigt'}</span></span>
        <span>${nob ? `<span class="pill open">${nob} ohne Zuständigkeit</span>` : open.length ? '' : '<span class="pill ok">fertig</span>'}</span></summary>
      <div class="body"><p>${esc(d.kurz)}</p>
        <div class="blk"><span class="eyebrow">Platz im Raum (Vorschlag)</span><p>${esc(d.ort)}</p><button type="button" class="btn ghost" data-show="${d.id}">Im Raum zeigen</button></div>
        <ul class="plain">${d.punkte.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
        <div class="grp">${mine.map(t => todoRow(t, 'i')).join('')}</div></div></details>`;
  }).join('');
}
function renderTodos() {
  const f = state.filter, people = Object.keys(WHO).filter(k => k !== 'ALLE');
  const match = t => f === 'alle' || (f === 'offen' ? !t.who.length : f === 'check' ? t.kind === 'check' : t.who.includes(f) || t.who.includes('ALLE'));
  const chip = (k, label) => `<button type="button" data-filter="${k}" aria-pressed="${f === k}">${esc(label)}</button>`;
  const list = TODOS.filter(match), open = list.filter(t => !isDone(t)).length;
  $('#tab-todos').innerHTML = `<div class="filters" role="group" aria-label="Filter">${chip('alle', 'Alle')}${people.map(p => chip(p, WHO[p])).join('')}${chip('offen', 'Ohne Zuständigkeit')}${chip('check', 'Erst klären')}</div>
    <p class="note">${open} von ${list.length} offen. Ein Haken gilt für alle, die diese Seite öffnen.</p>` +
    (list.length ? GRUPPEN.map(g => { const rows = list.filter(t => t.st === g.id); return rows.length ? `<div class="grp"><h3><i style="background:${g.color}"></i>${esc(g.name)}</h3>${rows.map(t => todoRow(t, 't')).join('')}</div>` : ''; }).join('') : '<p class="empty">Keine Aufgaben in dieser Auswahl.</p>');
}
function renderCounts() { const s = stats(); $('#cnt-open').textContent = s.open; }
function renderTodoViews() { renderUeber(); renderInseln(); renderTodos(); renderCounts(); }
$('#tabbody').addEventListener('change', e => {
  const id = e.target.dataset.todo; if (!id) return;
  const v = e.target.checked; if (v) state.done[id] = true; else delete state.done[id];
  write('todos', { done: { [id]: v } }, () => ({ done: state.done }));
  const keep = e.target.id; renderTodoViews(); $('#' + keep)?.focus({ preventScroll: true });
});
$('#tabbody').addEventListener('click', e => {
  const f = e.target.closest('[data-filter]'); if (f) { state.filter = f.dataset.filter; renderTodos(); return; }
  const s = e.target.closest('[data-show]'); if (s) { if (!state.expo) toggleExpo(true); select(s.dataset.show, { fly: true }); if (!matchMedia('(min-width: 901px)').matches) stageEl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); return; }
  const g = e.target.closest('[data-go]'); if (g) { setMove(true); if (!matchMedia('(min-width: 901px)').matches) stageEl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); }
});
$('#tabbody').addEventListener('toggle', e => { const d = e.target; if (d.classList?.contains('st')) { const id = d.id.slice(5); if (d.open) state.open.add(id); else state.open.delete(id); } }, true);

/* ---------- Rechner & Material ---------- */
function renderRechner() {
  $('#tab-rechner').innerHTML = `
  <div class="blk"><h2>Litfaß-Säule: Wie viele DIN-A2-Plakate passen?</h2>
    <p>Die Frage aus Protokoll 1. DIN A2 hochkant ist 42 × 59,4 cm. Sobald Corinna Molitor Durchmesser und Höhe kennt, hier einstellen – die Säule im Modell ändert sich mit.</p>
    <div class="calc">
      <div class="ctl"><label for="lf-d">Durchmesser der Säule</label><input type="range" id="lf-d" min="60" max="140" step="5"><output id="lf-d-o"></output></div>
      <div class="ctl"><label for="lf-h">Nutzbare Höhe für Plakate</label><input type="range" id="lf-h" min="120" max="200" step="5"><output id="lf-h-o"></output></div>
      <div class="ctl"><label for="lf-g">Abstand zwischen den Plakaten</label><input type="range" id="lf-g" min="0" max="6" step="1"><output id="lf-g-o"></output></div>
      <div class="result"><div><b id="lf-n"></b><span>Plakate pro Ring</span></div><div><b id="lf-r"></b><span>Ringe übereinander</span></div><div><b id="lf-t"></b><span>Plakate gesamt</span></div></div>
      <p class="note" id="lf-note"></p>
    </div></div>
  <div class="blk"><h2>Gebietsreform: runde Forexplatten</h2>
    <p>Die Wand ist rund 9,3 m lang und 2,50 m hoch. Jede dritte Platte hat im Modell Ø 60 cm, die übrigen Ø 50 cm.</p>
    <div class="calc">
      <div class="ctl"><label for="kr-n">Anzahl der Platten</label><input type="range" id="kr-n" min="6" max="16" step="1"><output id="kr-n-o"></output></div>
      <p class="note" id="kr-note"></p>
    </div></div>
  <div class="blk"><h2>Material und Sponsoring</h2>
    <p>Alles, was in den beiden Protokollen an Anschaffungen und Leihgaben genannt ist. Mengen mit „im Modell“ sind aus dem Vorschlag abgelesen.</p>
    <div class="tw"><table class="mat"><thead><tr><th>Was</th><th>Menge / Maß</th><th>Woher · Stand</th></tr></thead><tbody id="mat-body"></tbody></table></div></div>`;
  for (const [id, key] of [['lf-d', 'd'], ['lf-h', 'h'], ['lf-g', 'gap']]) $('#' + id).addEventListener('input', e => { state.calc.litfass[key] = Number(e.target.value); calcChanged('s5'); });
  $('#kr-n').addEventListener('input', e => { state.calc.kreise = Number(e.target.value); calcChanged('s6'); });
  syncCalc(true);
}
let calcT = 0, saveT = 0;
function calcChanged(id) {
  syncCalc(false);
  clearTimeout(calcT); calcT = setTimeout(() => items[id].remake(), 90);
  clearTimeout(saveT); saveT = setTimeout(() => write('plan', { calc: state.calc }, () => ({ pos: state.pos, calc: state.calc })), 500);
}
function syncCalc(remake) {
  if (!$('#lf-d')) return;
  const c = state.calc, p = litfassParams();
  $('#lf-d').value = c.litfass.d; $('#lf-h').value = c.litfass.h; $('#lf-g').value = c.litfass.gap; $('#kr-n').value = c.kreise;
  $('#lf-d-o').textContent = `${c.litfass.d} cm`; $('#lf-h-o').textContent = `${c.litfass.h} cm`; $('#lf-g-o').textContent = `${c.litfass.gap} cm`; $('#kr-n-o').textContent = `${c.kreise} Stück`;
  $('#lf-n').textContent = p.n; $('#lf-r').textContent = p.rows; $('#lf-t').textContent = p.total;
  $('#lf-note').textContent = `Umfang ${de(p.U / 100)} m. Mit Sockel und Haube wird die Säule im Modell rund ${de(p.hoehe)} m hoch` + (p.hoehe > 2.45 ? ' – das passt nicht unter die Decke von ca. 2,50 m.' : ', die Decke liegt bei ca. 2,50 m.');
  const ks = kreisLayout(c.kreise), n60 = ks.filter(k => k.rad === 0.3).length, area = ks.reduce((a, k) => a + PI * k.rad * k.rad, 0);
  $('#kr-note').textContent = `${ks.length} Platten: ${n60} × Ø 60 cm, ${ks.length - n60} × Ø 50 cm. Zusammen ${de(area, 1)} m² Forex, das sind ${Math.round(area / (9.3 * 2.5) * 100)} % der Wand.` + (ks.length < c.kreise ? ' Mehr passen mit Abstand nicht an die Wand.' : '');
  const rows = [
    ['Sofa und Teppich', '1 + 1', 'Neukauf XXL Lutz, Sponsoring anfragen (Scheibel, Lehnert)'],
    ['Einrichtung Wohnzimmer', '–', 'über Anjali Göbel (Molitor); Lagerplatz bis März offen'],
    ['Monitor mit Forex-Einhausung', '1', 'Sascha Becker'],
    ['Stellwand', '1 · im Modell 2,2 m breit', 'Bürgerhäuser (Molitor)'],
    ['70er-Tapete und Malerarbeit Koje', '≈ 11 m² im Modell', 'Malergeschäft aus Dreieich, Sponsoring – Anfrage offen'],
    ['Perücken, Kleider, Accessoires', '–', 'Faschingsbedarf; Bestellweg offen'],
    ['Mero-System mit Exponaten', 'im Modell 3 × 2 m', 'Corinna Molitor'],
    ['Litfaß-Säule', `im Modell Ø ${c.litfass.d} cm`, 'stellt Corinna Molitor'],
    ['Plakate DIN A2 hochkant', `${p.total} lt. Rechner`, 'Texte Gleichstellungsreferat → Gestaltung Sascha Becker'],
    ['Wandfarbe Orange', '≈ 23 m² (9,3 × 2,5 m)', 'Dreieicher Malerfirma, Sponsoring – Anfrage offen'],
    ['Runde Forexplatten', `${ks.length} · Ø 50/60 cm`, 'Grafik Sascha Becker, Produktion Vorschlag MSK'],
    ['Medienstelen', '3 im Modell', 'Stadt – Bestellung prüft Kim Lehnert'],
    ['Sitzkissen orange und lila', `${kissen.userData.count} im Modell`, 'Zuständigkeit offen'],
    ['Orange Folie für die Theke', 'Theke vor Ort messen', 'erst klären, ob Folieren möglich ist'],
    ['Willkommens-Fahne', '1 · im Modell 1,2 × 1,9 m', 'Zuständigkeit offen; Deckenhaken erst klären'],
  ];
  $('#mat-body').innerHTML = rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('');
  if (remake) { items.s5.remake(); items.s6.remake(); }
}

/* ---------- Start ---------- */
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight; if (!w || !h) return;
  if (renderer) renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  stageEl.classList.toggle('compact', w < 640);
  invalidate(3);
}
new ResizeObserver(resize).observe(stageEl);
resize();
renderTodoViews(); renderRechner(); setTab('ueber');
if (controls) { const [p, t] = POSES.iso(); camera.position.copy(p); controls.target.copy(t); controls.update(); }
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (tween) {
    const k = clamp((now - tween.s) / tween.ms, 0, 1), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.f0 !== tween.f1) { camera.fov = tween.f0 + (tween.f1 - tween.f0) * e; camera.updateProjectionMatrix(); }
    if (k >= 1) tween = null; invalidate();
  }
  if (state.walk) stepWalk(dt); else if (controls) controls.update();
  if (dirty > 0 && renderer) { dirty--; renderer.render(scene, camera); updateLabels(); }
}
requestAnimationFrame(frame);
initStore();
window.__popup = { state, items, setView, select, setMove, setWalk, startTour, setTab, camera, invalidate };

</script>
